<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página principal</title>
  <style>
    /* VARIABLES DE TEMA Y DEGRADADOS MODO OSCURO (macOS DARK) */
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #2e1065 70%, #030712 100%);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-hover: rgba(255, 255, 255, 0.15);
      --text-main: rgba(255, 255, 255, 0.95);
      --text-muted: rgba(255, 255, 255, 0.55);
      --text-subtle: rgba(255, 255, 255, 0.35);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-hover: rgba(255, 255, 255, 0.12);
      --modal-bg: rgba(20, 20, 25, 0.88);
      --input-bg: rgba(0, 0, 0, 0.25);
      --shadow-mac: 0 20px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--glass-border);
      --accent-color: #007aff;
      --accent-hover: #0062cc;
    }

    /* ADAPTACIÓN A MODO CLARO (macOS LIGHT) */
    @media (prefers-color-scheme: light) {
      :root {
        --bg-gradient: linear-gradient(135deg, #c7d2fe 0%, #e0e7ff 35%, #f3e8ff 70%, #e0f2fe 100%);
        --glass-bg: rgba(255, 255, 255, 0.55);
        --glass-border: rgba(255, 255, 255, 0.7);
        --glass-hover: rgba(255, 255, 255, 0.8);
        --text-main: rgba(15, 23, 42, 0.9);
        --text-muted: rgba(15, 23, 42, 0.6);
        --text-subtle: rgba(15, 23, 42, 0.4);
        --card-bg: rgba(255, 255, 255, 0.4);
        --card-border: rgba(255, 255, 255, 0.6);
        --card-hover: rgba(255, 255, 255, 0.75);
        --modal-bg: rgba(255, 255, 255, 0.92);
        --input-bg: rgba(255, 255, 255, 0.6);
        --shadow-mac: 0 15px 35px rgba(0, 0, 0, 0.08), 0 0 0 1px var(--glass-border);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-gradient);
      background-size: 200% 200%;
      animation: gradientShift 16s ease infinite alternate;
      color: var(--text-main);
      overflow-x: hidden;
      padding: 20px 24px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 100%; }
    }

    /* ENCABEZADO */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 12px;
    }

    .date-display {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .icon-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-mac);
    }

    .icon-btn:hover {
      background: var(--glass-hover);
      transform: scale(1.05);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* BARRA SUPERIOR DE IA (AI NAVBAR) */
    .ai-bar-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .ai-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: var(--shadow-mac);
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .ai-bar::-webkit-scrollbar {
      display: none;
    }

    .ai-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-main);
      text-decoration: none;
      background: transparent;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .ai-chip:hover {
      background: var(--glass-hover);
      transform: translateY(-1px);
    }

    .ai-chip span {
      font-size: 0.95rem;
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      margin-top: -10px;
    }

    /* RELOJ Y SALUDO */
    .clock-container {
      text-align: center;
    }

    .clock {
      font-size: 5.5rem;
      font-weight: 200;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text-main);
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .greeting {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* BARRA DE BÚSQUEDA */
    .search-box {
      width: 100%;
      position: relative;
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 20px;
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 16px 60px 16px 52px;
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-main);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: var(--shadow-mac);
      outline: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-input::placeholder {
      color: var(--text-subtle);
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.25), var(--shadow-mac);
      background: var(--glass-hover);
    }

    .kbd-hint {
      position: absolute;
      right: 18px;
      background: var(--glass-border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
    }

    /* FAVORITOS DE TEXTO ELEGANTE */
    .favorites-grid {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .fav-card {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      text-decoration: none;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fav-card:hover {
      background: var(--card-hover);
      border-color: var(--glass-border);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .fav-title {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-main);
      white-space: nowrap;
    }

    /* MODAL DE CONFIGURACIÓN */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-window {
      width: 90%;
      max-width: 480px;
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.active .modal-window {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
    }

    .section-subtitle {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin: 14px 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-row {
      display: flex;
      gap: 8px;
    }

    .modal-input {
      width: 100%;
      padding: 9px 12px;
      font-size: 0.88rem;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--input-bg);
      color: var(--text-main);
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--accent-color);
    }

    .btn-primary {
      padding: 9px 16px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .modal-fav-list {
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-fav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 12px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .modal-fav-info span {
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #ff453a;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 2px 6px;
    }

    footer {
      font-size: 0.75rem;
      color: var(--text-subtle);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="date-display" id="dateDisplay">---, -- -- ---</div>
    <button class="icon-btn" id="openSettings" title="Configuración de Enlaces">
      <svg viewBox="0 0 24 24">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </header>

  <!-- BARRA SUPERIOR DE IA -->
  <div class="ai-bar-wrapper">
    <nav class="ai-bar" id="aiBar"></nav>
  </div>

  <!-- CONTENIDO CENTRAL -->
  <main>
    <div class="clock-container">
      <div class="clock" id="clock">00:00</div>
      <div class="greeting" id="greeting">Hola</div>
    </div>

    <!-- BUSCADOR -->
    <div class="search-box">
      <form id="searchForm">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar en Google o escribir URL..." autocomplete="off" autofocus>
          <span class="kbd-hint">/</span>
        </div>
      </form>
    </div>

    <!-- GRILLA FAVORITOS -->
    <div class="favorites-grid" id="favoritesGrid"></div>
  </main>

  <footer>macOS Minimal Startpage</footer>

  <!-- MODAL DE AJUSTES -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title">Ajustes de Enlaces</h3>
        <button class="close-btn" id="closeSettings">&times;</button>
      </div>

      <!-- SECCIÓN HERRAMIENTAS DE IA -->
      <div class="section-subtitle">Herramientas IA (Barra Superior)</div>
      <form class="modal-form" id="addAiForm">
        <div class="modal-row">
          <input type="text" id="aiName" class="modal-input" placeholder="Nombre (ej. Perplexity)" required>
          <input type="url" id="aiUrl" class="modal-input" placeholder="URL (ej. https://...)" required>
        </div>
        <button type="submit" class="btn-primary">Añadir IA</button>
      </form>
      <div class="modal-fav-list" id="modalAiList"></div>

      <!-- SECCIÓN FAVORITOS GENERALES -->
      <div class="section-subtitle">Páginas Favoritas</div>
      <form class="modal-form" id="addFavForm">
        <div class="modal-row">
          <input type="text" id="favName" class="modal-input" placeholder="Nombre (ej. GitHub)" required>
          <input type="url" id="favUrl" class="modal-input" placeholder="URL (ej. https://...)" required>
        </div>
        <button type="submit" class="btn-primary">Añadir Favorito</button>
      </form>
      <div class="modal-fav-list" id="modalFavList"></div>

    </div>
  </div>

  <script>
    // IA PREDETERMINADAS
    const defaultAiTools = [
      { name: 'ChatGPT', url: 'https://chatgpt.com', symbol: '✦' },
      { name: 'Gemini', url: 'https://gemini.google.com', symbol: '✧' },
      { name: 'Claude', url: 'https://claude.ai', symbol: '✶' },
      { name: 'DeepSeek', url: 'https://chat.deepseek.com', symbol: '✸' },
      { name: 'Grok', url: 'https://x.com/i/grok', symbol: '✵' },
      { name: 'Perplexity', url: 'https://www.perplexity.ai', symbol: '☸' },
      { name: 'Copilot', url: 'https://copilot.microsoft.com', symbol: '❖' }
    ];

    // FAVORITOS PREDETERMINADOS
    const defaultFavorites = [
      { name: 'Google', url: 'https://www.google.com' },
      { name: 'Gmail', url: 'https://mail.google.com' },
      { name: 'YouTube', url: 'https://www.youtube.com' },
      { name: 'GitHub', url: 'https://github.com' }
    ];

    let aiTools = JSON.parse(localStorage.getItem('mac_ai_tools')) || defaultAiTools;
    let favorites = JSON.parse(localStorage.getItem('mac_text_favs')) || defaultFavorites;

    // RELOJ Y FECHA
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const h = now.getHours();
      let greeting = 'Buenas noches';
      if (h >= 5 && h < 12) greeting = 'Buenos días';
      else if (h >= 12 && h < 19) greeting = 'Buenas tardes';
      document.getElementById('greeting').textContent = greeting;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('dateDisplay').textContent = now.toLocaleDateString('es-ES', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // RENDERIZAR BARRA DE IA
    function renderAiBar() {
      const aiBar = document.getElementById('aiBar');
      const modalAiList = document.getElementById('modalAiList');

      aiBar.innerHTML = '';
      modalAiList.innerHTML = '';

      aiTools.forEach((ai, index) => {
        // Píldora en la barra superior
        const chip = document.createElement('a');
        chip.className = 'ai-chip';
        chip.href = ai.url;
        chip.innerHTML = `<span>${ai.symbol || '✦'}</span> ${ai.name}`;
        aiBar.appendChild(chip);

        // Item en el modal
        const item = document.createElement('div');
        item.className = 'modal-fav-item';
        item.innerHTML = `
          <div class="modal-fav-info">
            <span>${ai.symbol || '✦'} ${ai.name}</span>
          </div>
          <button class="delete-btn" onclick="removeAi(${index})">&times;</button>
        `;
        modalAiList.appendChild(item);
      });

      localStorage.setItem('mac_ai_tools', JSON.stringify(aiTools));
    }

    function removeAi(index) {
      aiTools.splice(index, 1);
      renderAiBar();
    }

    // RENDERIZAR FAVORITOS
    function renderFavorites() {
      const grid = document.getElementById('favoritesGrid');
      const modalList = document.getElementById('modalFavList');
      
      grid.innerHTML = '';
      modalList.innerHTML = '';

      favorites.forEach((fav, index) => {
        const card = document.createElement('a');
        card.className = 'fav-card';
        card.href = fav.url;
        card.innerHTML = `<span class="fav-title">${fav.name}</span>`;
        grid.appendChild(card);

        const item = document.createElement('div');
        item.className = 'modal-fav-item';
        item.innerHTML = `
          <div class="modal-fav-info">
            <span>${fav.name}</span>
          </div>
          <button class="delete-btn" onclick="removeFavorite(${index})">&times;</button>
        `;
        modalList.appendChild(item);
      });

      localStorage.setItem('mac_text_favs', JSON.stringify(favorites));
    }

    function removeFavorite(index) {
      favorites.splice(index, 1);
      renderFavorites();
    }

    // FORMULARIO AGREGAR IA
    document.getElementById('addAiForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('aiName').value.trim();
      let url = document.getElementById('aiUrl').value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

      aiTools.push({ name, url, symbol: '✦' });
      renderAiBar();

      document.getElementById('aiName').value = '';
      document.getElementById('aiUrl').value = '';
    });

    // FORMULARIO AGREGAR FAVORITO
    document.getElementById('addFavForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('favName').value.trim();
      let url = document.getElementById('favUrl').value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

      favorites.push({ name, url });
      renderFavorites();

      document.getElementById('favName').value = '';
      document.getElementById('favUrl').value = '';
    });

    // BUSCADOR
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const isUrl = /^https?:\/\//i.test(query) || (query.includes('.') && !query.includes(' '));
      if (isUrl) {
        window.location.href = query.startsWith('http') ? query : `https://${query}`;
      } else {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      }
    });

    // ATAJO TECLADO ('/')
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });

    // MODAL
    const modal = document.getElementById('modalBackdrop');
    document.getElementById('openSettings').onclick = () => modal.classList.add('active');
    document.getElementById('closeSettings').onclick = () => modal.classList.remove('active');
    modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

    // INICIALIZAR
    renderAiBar();
    renderFavorites();
  </script>
</body>
</html>
