<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'blob': 'blob 18s infinite alternate ease-in-out',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(40px, -60px) scale(1.1)' },
                            '66%': { transform: 'translate(-30px, 30px) scale(0.95)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Desplazamiento suave y personalizado de scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        .glass-panel {
            background: rgba(20, 24, 33, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input:focus-within {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 25px -5px rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-indigo-500 selection:text-white relative">

    <!-- Fondo Abstracto Animado -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[20%] -left-[10%] w-[60vw] h-[60vw] max-w-[700px] max-h-[700px] rounded-full bg-gradient-to-br from-indigo-900/40 via-purple-900/30 to-pink-900/10 blur-[120px] animate-blob"></div>
        <div class="absolute top-[40%] -right-[15%] w-[55vw] h-[55vw] max-w-[650px] max-h-[650px] rounded-full bg-gradient-to-tl from-blue-900/40 via-teal-900/20 to-emerald-900/10 blur-[120px] animate-blob [animation-delay:4s]"></div>
        <div class="absolute -bottom-[20%] left-[20%] w-[50vw] h-[50vw] max-w-[600px] max-h-[600px] rounded-full bg-gradient-to-tr from-violet-900/30 via-slate-900/40 to-blue-900/20 blur-[100px] animate-blob [animation-delay:8s]"></div>
        <div class="absolute inset-0 bg-[radial-gradient(rgba(255,255,255,0.03)_1px,transparent_1px)] [background-size:32px_32px] opacity-40"></div>
    </div>

    <!-- Botón de Configuración Top-Right -->
    <header class="relative z-10 p-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="text-xs tracking-widest text-slate-400 font-medium uppercase select-none opacity-80" id="current-date">
            Cargando fecha...
        </div>
        <button id="open-settings-btn" aria-label="Configuración" class="p-3 rounded-full text-slate-400 hover:text-white hover:bg-white/10 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-white/20">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </header>

    <!-- Contenido Principal -->
    <main class="relative z-10 min-h-[calc(100vh-140px)] flex flex-col items-center justify-center px-4 -mt-10">
        <div class="w-full max-w-3xl flex flex-col items-center space-y-8">
            
            <!-- Reloj y Saludo -->
            <div class="text-center space-y-2 select-none">
                <h1 id="clock" class="text-6xl sm:text-7xl md:text-8xl font-extralight tracking-tight text-white drop-shadow-sm">
                    00:00
                </h1>
                <p id="greeting" class="text-lg sm:text-xl font-light text-slate-300/90 tracking-wide">
                    Buenas días
                </p>
            </div>

            <!-- Buscador de Google -->
            <form action="https://www.google.com/search" method="GET" class="w-full">
                <div class="glass-input w-full rounded-2xl flex items-center px-5 py-4 transition-all duration-300 group">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 text-lg mr-4 group-focus-within:text-indigo-400 transition-colors"></i>
                    <input 
                        type="text" 
                        name="q" 
                        id="search-input"
                        placeholder="Buscar en Google o escribir una URL..." 
                        autocomplete="off"
                        autofocus
                        class="w-full bg-transparent text-white placeholder-slate-400/80 focus:outline-none text-base sm:text-lg font-normal"
                    >
                    <button type="submit" class="hidden sm:flex items-center justify-center text-xs font-semibold px-3 py-1.5 rounded-lg bg-white/10 text-slate-300 hover:bg-white/20 hover:text-white transition">
                        Enter <i class="fa-solid fa-arrow-right text-[10px] ml-1.5"></i>
                    </button>
                </div>
            </form>

            <!-- Lista de Favoritos -->
            <div id="favorites-grid" class="w-full grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 pt-4">
                <!-- Se puebla dinámicamente desde JS -->
            </div>

        </div>
    </main>

    <!-- Modal de Configuración -->
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden transition-opacity duration-300">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl relative animate-fade-in border border-white/10">
            
            <!-- Header Modal -->
            <div class="flex justify-between items-center pb-4 border-b border-white/10">
                <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-indigo-400 text-lg"></i> Administrar Favoritos
                </h2>
                <button id="close-settings-btn" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Formulario para Añadir -->
            <form id="add-favorite-form" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1 font-medium">Nombre</label>
                        <input type="text" id="fav-title" placeholder="Ej: YouTube" required class="w-full glass-input px-3.5 py-2.5 rounded-xl text-sm text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1 font-medium">URL de la web</label>
                        <input type="url" id="fav-url" placeholder="https://youtube.com" required class="w-full glass-input px-3.5 py-2.5 rounded-xl text-sm text-white focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">Icono FontAwesome (Opcional)</label>
                    <input type="text" id="fav-icon" placeholder="Ej: fa-brands fa-youtube" class="w-full glass-input px-3.5 py-2.5 rounded-xl text-sm text-white focus:outline-none">
                    <p class="text-[11px] text-slate-500 mt-1">Usa clases de FontAwesome o déjalo vacío para autodetección.</p>
                </div>
                <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Añadir Favorito
                </button>
            </form>

            <!-- Lista de Favoritos Administrables -->
            <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Tus Enlaces</h3>
                <div id="modal-favorites-list" class="space-y-2">
                    <!-- Dinámico -->
                </div>
            </div>

        </div>
    </div>

    <!-- JS Logic -->
    <script>
        // Configuración inicial por defecto
        const defaultFavorites = [
            { id: '1', title: 'YouTube', url: 'https://youtube.com', icon: 'fa-brands fa-youtube' },
            { id: '2', title: 'GitHub', url: 'https://github.com', icon: 'fa-brands fa-github' },
            { id: '3', title: 'Gemini', url: 'https://gemini.google.com', icon: 'fa-solid fa-sparkles' },
            { id: '4', title: 'Gmail', url: 'https://mail.google.com', icon: 'fa-solid fa-envelope' }
        ];

        // Estado local
        let favorites = JSON.parse(localStorage.getItem('custom_favorites')) || defaultFavorites;

        // Elementos DOM
        const favoritesGrid = document.getElementById('favorites-grid');
        const modalFavoritesList = document.getElementById('modal-favorites-list');
        const addFavoriteForm = document.getElementById('add-favorite-form');
        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const clockEl = document.getElementById('clock');
        const greetingEl = document.getElementById('greeting');
        const currentDateEl = document.getElementById('current-date');
        const searchInput = document.getElementById('search-input');

        // Guardar en localStorage
        function saveFavorites() {
            localStorage.setItem('custom_favorites', JSON.stringify(favorites));
            renderFavorites();
            renderModalFavorites();
        }

        // Obtener icono apropiado
        function getIconClass(item) {
            if (item.icon && item.icon.trim() !== '') {
                return item.icon;
            }
            // Auto detección básica por URL
            const url = item.url.toLowerCase();
            if (url.includes('youtube')) return 'fa-brands fa-youtube';
            if (url.includes('github')) return 'fa-brands fa-github';
            if (url.includes('twitter') || url.includes('x.com')) return 'fa-brands fa-x-twitter';
            if (url.includes('facebook')) return 'fa-brands fa-facebook';
            if (url.includes('instagram')) return 'fa-brands fa-instagram';
            if (url.includes('drive')) return 'fa-brands fa-google-drive';
            if (url.includes('gmail') || url.includes('mail')) return 'fa-solid fa-envelope';
            if (url.includes('netflix')) return 'fa-solid fa-film';
            if (url.includes('spotify')) return 'fa-brands fa-spotify';
            
            return 'fa-solid fa-globe';
        }

        // Renderizar Cuadrícula Principal
        function renderFavorites() {
            favoritesGrid.innerHTML = '';
            favorites.forEach(fav => {
                const card = document.createElement('a');
                card.href = fav.url;
                card.className = 'glass-card p-4 rounded-2xl flex flex-col items-center justify-center text-center group cursor-pointer border border-white/5';
                
                const iconClass = getIconClass(fav);

                card.innerHTML = `
                    <div class="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center mb-3 group-hover:scale-110 group-hover:bg-white/10 transition-all text-indigo-300 group-hover:text-white">
                        <i class="${iconClass} text-xl"></i>
                    </div>
                    <span class="text-sm font-medium text-slate-200 group-hover:text-white truncate w-full">${fav.title}</span>
                `;
                favoritesGrid.appendChild(card);
            });
        }

        // Renderizar Lista en Modal
        function renderModalFavorites() {
            modalFavoritesList.innerHTML = '';
            if (favorites.length === 0) {
                modalFavoritesList.innerHTML = `<p class="text-xs text-slate-500 py-2 text-center">No hay accesos agregados.</p>`;
                return;
            }

            favorites.forEach(fav => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5';
                item.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <i class="${getIconClass(fav)} text-indigo-400 w-5 text-center"></i>
                        <div class="truncate">
                            <p class="text-xs font-medium text-white truncate">${fav.title}</p>
                            <p class="text-[10px] text-slate-400 truncate">${fav.url}</p>
                        </div>
                    </div>
                    <button onclick="deleteFavorite('${fav.id}')" class="text-slate-400 hover:text-red-400 p-1.5 rounded-lg hover:bg-white/10 transition">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                modalFavoritesList.appendChild(item);
            });
        }

        // Añadir Favorito
        addFavoriteForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('fav-title').value.trim();
            let url = document.getElementById('fav-url').value.trim();
            const icon = document.getElementById('fav-icon').value.trim();

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const newFav = {
                id: Date.now().toString(),
                title,
                url,
                icon
            };

            favorites.push(newFav);
            saveFavorites();
            addFavoriteForm.reset();
        });

        // Eliminar Favorito
        window.deleteFavorite = function(id) {
            favorites = favorites.filter(fav => fav.id !== id);
            saveFavorites();
        };

        // Modal Controls
        openSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.add('hidden');
            }
        });

        // Reloj y Saludo
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            clockEl.textContent = `${hours}:${minutes}`;

            // Saludo según la hora
            const currentHour = now.getHours();
            if (currentHour >= 5 && currentHour < 12) {
                greetingEl.textContent = 'Buenos días';
            } else if (currentHour >= 12 && currentHour < 19) {
                greetingEl.textContent = 'Buenas tardes';
            } else {
                greetingEl.textContent = 'Buenas noches';
            }

            // Fecha
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            currentDateEl.textContent = now.toLocaleDateString('es-ES', options);
        }

        // Atajo Teclado: Presionar '/' para ir al buscador
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput && settingsModal.classList.contains('hidden')) {
                e.preventDefault();
                searchInput.focus();
            }
            if (e.key === 'Escape' && !settingsModal.classList.contains('hidden')) {
                settingsModal.classList.add('hidden');
            }
        });

        // Inicializar
        updateClock();
        setInterval(updateClock, 1000);
        renderFavorites();
        renderModalFavorites();
    </script>
</body>
</html>
