<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página principal</title>
  <style>
    /* VARIABLES DE TEMA (MODO OSCURO POR DEFECTO - macOS DARK) */
    :root {
      --bg-gradient-1: #0f172a;
      --bg-gradient-2: #1e1b4b;
      --bg-gradient-3: #2e1065;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-hover: rgba(255, 255, 255, 0.15);
      --text-main: rgba(255, 255, 255, 0.95);
      --text-muted: rgba(255, 255, 255, 0.55);
      --text-subtle: rgba(255, 255, 255, 0.35);
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-hover: rgba(255, 255, 255, 0.12);
      --modal-bg: rgba(24, 24, 27, 0.85);
      --input-bg: rgba(0, 0, 0, 0.25);
      --shadow-mac: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px var(--glass-border);
      --accent-color: #007aff;
      --accent-hover: #0062cc;
    }

    /* MODO CLARO DE macOS (ADAPTACIÓN AUTOMÁTICA DEL SISTEMA) */
    @media (prefers-color-scheme: light) {
      :root {
        --bg-gradient-1: #e0e7ff;
        --bg-gradient-2: #f3e8ff;
        --bg-gradient-3: #e0f2fe;
        --glass-bg: rgba(255, 255, 255, 0.55);
        --glass-border: rgba(255, 255, 255, 0.7);
        --glass-hover: rgba(255, 255, 255, 0.75);
        --text-main: rgba(15, 23, 42, 0.9);
        --text-muted: rgba(15, 23, 42, 0.6);
        --text-subtle: rgba(15, 23, 42, 0.4);
        --card-bg: rgba(255, 255, 255, 0.45);
        --card-border: rgba(255, 255, 255, 0.6);
        --card-hover: rgba(255, 255, 255, 0.8);
        --modal-bg: rgba(255, 255, 255, 0.88);
        --input-bg: rgba(255, 255, 255, 0.6);
        --shadow-mac: 0 15px 35px rgba(0, 0, 0, 0.08), 0 0 0 1px var(--glass-border);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: radial-gradient(circle at 20% 20%, var(--bg-gradient-1), transparent 60%),
                  radial-gradient(circle at 80% 30%, var(--bg-gradient-2), transparent 60%),
                  radial-gradient(circle at 50% 80%, var(--bg-gradient-3), transparent 70%);
      background-size: 150% 150%;
      animation: ambientGradient 18s ease infinite alternate;
      color: var(--text-main);
      overflow-x: hidden;
      padding: 24px;
    }

    @keyframes ambientGradient {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 100%; }
    }

    /* ENCABEZADO macOS ESTILO MENU BAR */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 12px;
    }

    .date-display {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .icon-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-mac);
    }

    .icon-btn:hover {
      background: var(--glass-hover);
      transform: scale(1.05);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      margin-top: -40px;
    }

    /* RELOJ Y SALUDO */
    .clock-container {
      text-align: center;
    }

    .clock {
      font-size: 5.5rem;
      font-weight: 200;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text-main);
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .greeting {
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* BARRA DE BÚSQUEDA TIPO macOS SFI / SPOTLIGHT */
    .search-box {
      width: 100%;
      position: relative;
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 20px;
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 16px 60px 16px 52px;
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-main);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow: var(--shadow-mac);
      outline: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-input::placeholder {
      color: var(--text-subtle);
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.25), var(--shadow-mac);
      background: var(--glass-hover);
    }

    .kbd-hint {
      position: absolute;
      right: 18px;
      background: var(--glass-border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
    }

    /* GRILLA DE FAVORITOS (FAVICONS EN HD Y ESTILO macOS SQUIRCLE) */
    .favorites-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 16px;
      justify-items: center;
    }

    .fav-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 14px 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      text-decoration: none;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fav-card:hover {
      background: var(--card-hover);
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }

    .fav-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .fav-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .fav-title {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-main);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      padding: 0 4px;
    }

    /* MODAL DE CONFIGURACIÓN CON ESTILO HOJA / HOVER DE macOS */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-window {
      width: 90%;
      max-width: 460px;
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.active .modal-window {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .modal-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--input-bg);
      color: var(--text-main);
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--accent-color);
    }

    .btn-primary {
      padding: 10px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .modal-fav-list {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-fav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .modal-fav-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .modal-fav-info img {
      width: 20px;
      height: 20px;
    }

    .modal-fav-info span {
      font-size: 0.85rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #ff453a;
      cursor: pointer;
      padding: 4px;
    }

    footer {
      font-size: 0.75rem;
      color: var(--text-subtle);
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="date-display" id="dateDisplay">---, -- -- ---</div>
    <button class="icon-btn" id="openSettings" title="Configuración de Favoritos">
      <svg viewBox="0 0 24 24">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </header>

  <!-- CONTENIDO CENTRAL -->
  <main>
    <div class="clock-container">
      <div class="clock" id="clock">00:00</div>
      <div class="greeting" id="greeting">Hola</div>
    </div>

    <!-- BUSCADOR -->
    <div class="search-box">
      <form id="searchForm">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar en Google o escribir dirección web..." autocomplete="off" autofocus>
          <span class="kbd-hint">/</span>
        </div>
      </form>
    </div>

    <!-- GRILLA FAVORITOS -->
    <div class="favorites-grid" id="favoritesGrid"></div>
  </main>

  <footer>macOS Style Startpage</footer>

  <!-- MODAL DE AJUSTES -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title">Editar Favoritos</h3>
        <button class="close-btn" id="closeSettings">&times;</button>
      </div>

      <form class="modal-form" id="addFavForm">
        <input type="text" id="favName" class="modal-input" placeholder="Nombre (ej. YouTube)" required>
        <input type="url" id="favUrl" class="modal-input" placeholder="URL (ej. https://youtube.com)" required>
        <button type="submit" class="btn-primary">Añadir sitio</button>
      </form>

      <div class="modal-fav-list" id="modalFavList"></div>
    </div>
  </div>

  <script>
    // LISTA DE FAVORITOS PREDETERMINADA
    const defaultFavorites = [
      { name: 'Google', url: 'https://www.google.com' },
      { name: 'Gmail', url: 'https://mail.google.com' },
      { name: 'YouTube', url: 'https://www.youtube.com' },
      { name: 'GitHub', url: 'https://github.com' },
      { name: 'Gemini', url: 'https://gemini.google.com' }
    ];

    let favorites = JSON.parse(localStorage.getItem('mac_favs')) || defaultFavorites;

    // FECHA Y RELOJ
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      // Saludo dinámico
      const h = now.getHours();
      let greeting = 'Buenas noches';
      if (h >= 5 && h < 12) greeting = 'Buenos días';
      else if (h >= 12 && h < 19) greeting = 'Buenas tardes';
      document.getElementById('greeting').textContent = greeting;

      // Fecha
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('dateDisplay').textContent = now.toLocaleDateString('es-ES', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // OBTENER FAVICON DE ALTA RESOLUCIÓN MEDIANTE GOOGLE API
    function getFaviconUrl(domainUrl) {
      try {
        const domain = new URL(domainUrl).hostname;
        return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
      } catch (e) {
        return '';
      }
    }

    // RENDERIZAR FAVORITOS
    function renderFavorites() {
      const grid = document.getElementById('favoritesGrid');
      const modalList = document.getElementById('modalFavList');
      
      grid.innerHTML = '';
      modalList.innerHTML = '';

      favorites.forEach((fav, index) => {
        const iconUrl = getFaviconUrl(fav.url);

        // Render para la grilla principal
        const card = document.createElement('a');
        card.className = 'fav-card';
        card.href = fav.url;
        card.innerHTML = `
          <div class="fav-icon-wrapper">
            <img class="fav-icon" src="${iconUrl}" alt="${fav.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23888\'><path d=\'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z\'/></svg>'">
          </div>
          <span class="fav-title">${fav.name}</span>
        `;
        grid.appendChild(card);

        // Render para la lista del modal de ajustes
        const item = document.createElement('div');
        item.className = 'modal-fav-item';
        item.innerHTML = `
          <div class="modal-fav-info">
            <img src="${iconUrl}" alt="">
            <span>${fav.name}</span>
          </div>
          <button class="delete-btn" onclick="removeFavorite(${index})">&times;</button>
        `;
        modalList.appendChild(item);
      });

      localStorage.setItem('mac_favs', JSON.stringify(favorites));
    }

    function removeFavorite(index) {
      favorites.splice(index, 1);
      renderFavorites();
    }

    // AÑADIR FAVORITO
    document.getElementById('addFavForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('favName').value.trim();
      let url = document.getElementById('favUrl').value.trim();

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      favorites.push({ name, url });
      renderFavorites();

      document.getElementById('favName').value = '';
      document.getElementById('favUrl').value = '';
    });

    // BUSCADOR DE GOOGLE / NAVEGACIÓN DIRECTA
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const isUrl = /^https?:\/\//i.test(query) || (query.includes('.') && !query.includes(' '));
      if (isUrl) {
        window.location.href = query.startsWith('http') ? query : `https://${query}`;
      } else {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      }
    });

    // ATAJO DE TECLADO ('/' PARA ENFOCAR BUSCADOR)
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });

    // MODAL
    const modal = document.getElementById('modalBackdrop');
    document.getElementById('openSettings').onclick = () => modal.classList.add('active');
    document.getElementById('closeSettings').onclick = () => modal.classList.remove('active');
    modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

    // INICIALIZACIÓN
    renderFavorites();
  </script>
</body>
</html>
